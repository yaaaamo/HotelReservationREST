<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agences - Comparateur d'Hôtels</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-building"></i> HotelCompare
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link active" href="/agencies">
                <i class="bi bi-shop"></i> Agences
            </a>
        </div>
    </div>
</nav>

<div class="container my-5">
    <h2 class="mb-4"><i class="bi bi-shop"></i> Agences Partenaires</h2>

    <div class="row">
        <div th:each="agency : ${agencies}" class="col-md-6 mb-4">
            <div class="card" th:classappend="${agency.available} ? 'border-success' : 'border-danger'">
                <div class="card-body">
                    <div class="d-flex align-items-center">
                        <div th:if="${agency.available}">
                            <i class="bi bi-check-circle-fill text-success display-6 me-3"></i>
                        </div>
                        <div th:unless="${agency.available}">
                            <i class="bi bi-x-circle-fill text-danger display-6 me-3"></i>
                        </div>
                        <div>
                            <h5 th:if="${agency.info != null}" th:text="${agency.info.agenceName}">Agence</h5>
                            <h5 th:unless="${agency.info != null}">Agence indisponible</h5>
                            <p class="text-muted mb-0 small" th:text="${agency.url}">URL</p>
                            <span th:if="${agency.available}" class="badge bg-success">En ligne</span>
                            <span th:unless="${agency.available}" class="badge bg-danger">Hors ligne</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <a href="/" class="btn btn-primary">
        <i class="bi bi-arrow-left"></i> Retour à l'accueil
    </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
