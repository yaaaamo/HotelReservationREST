<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparateur d'Hôtels</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .hero-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 80px 0;
        }
        .search-card {
            margin-top: -60px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        .btn-search {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 40px;
        }
        .btn-search:hover {
            background: linear-gradient(135deg, #5a6fd6 0%, #6a4190 100%);
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-building"></i> HotelCompare
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/agencies">
                <i class="bi bi-shop"></i> Agences Partenaires
            </a>
        </div>
    </div>
</nav>


<section class="hero-section text-center">
    <div class="container">
        <h1 class="display-4 fw-bold mb-3">
            <i class="bi bi-search"></i> Trouvez l'hôtel idéal
        </h1>
        <p class="lead">Comparez les offres de plusieurs agences en un clic</p>
    </div>
</section>


<div class="container">
    <div class="card search-card p-4">
        <form th:action="@{/search}" method="post" th:object="${searchRequest}">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label"><i class="bi bi-geo-alt"></i> Ville</label>
                    <input type="text" class="form-control form-control-lg"
                           th:field="*{ville}" placeholder="Ex: Paris">
                </div>
                <div class="col-md-2">
                    <label class="form-label"><i class="bi bi-calendar"></i> Arrivée</label>
                    <input type="date" class="form-control form-control-lg"
                           th:field="*{dateDebut}" th:min="${today}" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label"><i class="bi bi-calendar-check"></i> Départ</label>
                    <input type="date" class="form-control form-control-lg"
                           th:field="*{dateFin}" th:min="${today}" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label"><i class="bi bi-people"></i> Personnes</label>
                    <select class="form-select form-select-lg" th:field="*{nbPersonnes}">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label"><i class="bi bi-star"></i> Étoiles min</label>
                    <select class="form-select form-select-lg" th:field="*{nombreEtoilesMin}">
                        <option value="0">Toutes</option>
                        <option value="1">1★</option>
                        <option value="2">2★</option>
                        <option value="3">3★</option>
                        <option value="4">4★</option>
                        <option value="5">5★</option>
                    </select>
                </div>
            </div>
            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary btn-lg btn-search">
                    <i class="bi bi-search"></i> Rechercher
                </button>
            </div>
        </form>
    </div>
</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
