<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Résultats - Comparateur d'Hôtels</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .offer-card {
            transition: transform 0.2s, box-shadow 0.2s;
            border-radius: 15px;
        }
        .offer-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .price-tag {
            font-size: 1.5rem;
            font-weight: bold;
            color: #28a745;
        }
        .agency-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .stars { color: #ffc107; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-building"></i> HotelCompare
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/agencies">
                <i class="bi bi-shop"></i> Agences
            </a>
        </div>
    </div>
</nav>

<div class="container my-4">

    <div class="card mb-4">
        <div class="card-body">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <h5 class="mb-0">
                        <i class="bi bi-search"></i>
                        <span th:if="${searchForm.ville != null}" th:text="${searchForm.ville}">Ville</span>
                        <span th:unless="${searchForm.ville != null}">Toutes les villes</span>
                        &bull;
                        <span th:text="${#temporals.format(searchForm.dateDebut, 'dd/MM/yyyy')}"></span>
                        →
                        <span th:text="${#temporals.format(searchForm.dateFin, 'dd/MM/yyyy')}"></span>
                        &bull;
                        <span th:text="${searchForm.nbPersonnes}"></span> personne(s)
                    </h5>
                </div>
                <div class="col-md-4 text-end">
                    <a href="/" class="btn btn-outline-primary">
                        <i class="bi bi-arrow-left"></i> Nouvelle recherche
                    </a>
                </div>
            </div>
        </div>
    </div>


    <div th:if="${!errors.isEmpty()}" class="alert alert-warning">
        <i class="bi bi-exclamation-triangle"></i>
        <span th:each="error : ${errors}" th:text="${error}"></span>
    </div>


    <h4 class="mb-4">
        <span th:text="${#lists.size(offers)}">0</span> offre(s) trouvée(s)
    </h4>

    <div th:if="${#lists.isEmpty(offers)}" class="text-center py-5">
        <i class="bi bi-emoji-frown display-1 text-muted"></i>
        <h3 class="mt-3 text-muted">Aucune offre disponible</h3>
        <p class="text-muted">Essayez de modifier vos critères de recherche</p>
        <a href="/" class="btn btn-primary mt-3">
            <i class="bi bi-search"></i> Nouvelle recherche
        </a>
    </div>

    <div class="row">
        <div th:each="offerView, iterStat : ${offers}" class="col-md-6 col-lg-4 mb-4">
            <div class="card offer-card h-100">
                <div th:if="${offerView.offer.imageUrl != null}" class="card-img-top"
                     th:style="'height: 150px; background: url(' + ${offerView.offer.imageUrl} + ') center/cover;'">
                </div>
                <div th:unless="${offerView.offer.imageUrl != null}"
                     class="card-img-top bg-secondary text-white d-flex align-items-center justify-content-center"
                     style="height: 150px;">
                    <i class="bi bi-building display-4"></i>
                </div>

                <div class="card-body">

                    <span class="badge agency-badge mb-2"
                          th:text="${offerView.offer.agenceName}">Agence</span>


                    <h5 class="card-title" th:text="${offerView.offer.hotelName}">Hôtel</h5>


                    <div class="stars mb-2">
                        <span th:each="i : ${#numbers.sequence(1, offerView.offer.nombreEtoiles)}">★</span>
                    </div>


                    <p class="card-text text-muted small">
                        <i class="bi bi-geo-alt"></i>
                        <span th:text="${offerView.offer.adresseHotel}">Adresse</span>
                    </p>
                    <p class="card-text">
                        <i class="bi bi-door-open"></i>
                        <span th:text="${offerView.offer.typeChambre}">Type</span>
                        &bull;
                        <i class="bi bi-person"></i>
                        <span th:text="${offerView.offer.nbLits}">2</span> lit(s)
                    </p>


                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <span class="price-tag" th:text="${#numbers.formatDecimal(offerView.offer.prix, 1, 2)} + ' €'">0.00 €</span>
                        <a th:href="@{/book/{index}(index=${iterStat.index})}"
                           class="btn btn-success">
                            <i class="bi bi-check-circle"></i> Réserver
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
