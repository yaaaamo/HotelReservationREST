<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservation - Comparateur d'Hôtels</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-building"></i> HotelCompare
        </a>
    </div>
</nav>

<div class="container my-5">
    <div class="row">

        <div class="col-md-5">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="bi bi-info-circle"></i> Récapitulatif</h5>
                </div>
                <div class="card-body">
                    <h4 th:text="${offer.offer.hotelName}">Hôtel</h4>
                    <p class="text-warning">
                        <span th:each="i : ${#numbers.sequence(1, offer.offer.nombreEtoiles)}">★</span>
                    </p>
                    <hr>
                    <p><i class="bi bi-shop"></i> <strong>Agence:</strong>
                        <span th:text="${offer.offer.agenceName}">Agence</span></p>
                    <p><i class="bi bi-geo-alt"></i> <strong>Adresse:</strong>
                        <span th:text="${offer.offer.adresseHotel}">Adresse</span></p>
                    <p><i class="bi bi-door-open"></i> <strong>Chambre:</strong>
                        <span th:text="${offer.offer.typeChambre}">Type</span>
                        (<span th:text="${offer.offer.nbLits}">2</span> lit(s))</p>
                    <p><i class="bi bi-calendar"></i> <strong>Du:</strong>
                        <span th:text="${#temporals.format(offer.offer.dateDebut, 'dd/MM/yyyy')}"></span>
                        <strong>au:</strong>
                        <span th:text="${#temporals.format(offer.offer.dateFin, 'dd/MM/yyyy')}"></span></p>
                    <hr>
                    <h3 class="text-success">
                        Prix total: <span th:text="${#numbers.formatDecimal(offer.offer.prix, 1, 2)}">0.00</span> €
                    </h3>
                </div>
            </div>
        </div>


        <div class="col-md-7">
            <div class="card">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0"><i class="bi bi-person"></i> Vos informations</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/book/{index}(index=${offerIndex})}" method="post"
                          th:object="${bookingForm}">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Prénom *</label>
                                <input type="text" class="form-control" th:field="*{prenom}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nom *</label>
                                <input type="text" class="form-control" th:field="*{nom}" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email *</label>
                            <input type="email" class="form-control" th:field="*{email}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Téléphone</label>
                            <input type="tel" class="form-control" th:field="*{telephone}">
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between">
                            <a href="javascript:history.back()" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left"></i> Retour
                            </a>
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="bi bi-check-circle"></i> Confirmer la réservation
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
