<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation - Comparateur d'Hôtels</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-building"></i> HotelCompare
        </a>
    </div>
</nav>

<div class="container my-5">

    <div th:if="${success}" class="text-center">
        <div class="card border-success">
            <div class="card-body py-5">
                <i class="bi bi-check-circle-fill text-success display-1"></i>
                <h2 class="mt-4 text-success">Réservation confirmée !</h2>
                <p class="lead">Votre référence de réservation:</p>
                <h3 class="bg-light p-3 rounded" th:text="${reservation.reservationRef}">REF-XXX</h3>

                <div class="mt-4 text-start">
                    <div class="row justify-content-center">
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-body">
                                    <h5><i class="bi bi-building"></i> Détails</h5>
                                    <p><strong>Hôtel:</strong> <span th:text="${offer.offer.hotelName}"></span></p>
                                    <p><strong>Agence:</strong> <span th:text="${offer.offer.agenceName}"></span></p>
                                    <p><strong>Client:</strong> <span th:text="${client.prenom + ' ' + client.nom}"></span></p>
                                    <p><strong>Email:</strong> <span th:text="${client.email}"></span></p>
                                    <p><strong>Prix:</strong> <span th:text="${#numbers.formatDecimal(offer.offer.prix, 1, 2)} + ' €'"></span></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <a href="/" class="btn btn-primary btn-lg mt-4">
                    <i class="bi bi-house"></i> Retour à l'accueil
                </a>
            </div>
        </div>
    </div>


    <div th:unless="${success}" class="text-center">
        <div class="card border-danger">
            <div class="card-body py-5">
                <i class="bi bi-x-circle-fill text-danger display-1"></i>
                <h2 class="mt-4 text-danger">Échec de la réservation</h2>
                <p class="lead text-muted" th:text="${error}">Erreur</p>
                <a href="javascript:history.back()" class="btn btn-secondary mt-3">
                    <i class="bi bi-arrow-left"></i> Réessayer
                </a>
                <a href="/" class="btn btn-primary mt-3">
                    <i class="bi bi-house"></i> Accueil
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
